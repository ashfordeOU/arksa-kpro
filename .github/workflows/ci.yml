name: CI
on:
  push:
    branches: [main, "ws/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # GitHub-hosted (public repository since 20 Nov 2026; hosted minutes are free).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # --locked: Cargo.lock pins kshana-pro's exact commit and every crate version.
      - name: Test
        run: cargo test --all --locked
